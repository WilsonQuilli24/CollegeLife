name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: python -m py_compile main.py

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  security:
    name: security
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Backend dependency audit
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - name: Frontend dependency audit (high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  test:
    name: test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run backend tests (coverage quality gate)
        working-directory: backend
        run: pytest -q

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend unit/component tests
        working-directory: frontend
        run: npm run test

      - name: Run frontend coverage (quality gate)
        working-directory: frontend
        run: npm run test:coverage

      - name: Install Playwright browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run frontend E2E
        working-directory: frontend
        run: npm run e2e

  package:
    name: package
    runs-on: ubuntu-latest
    needs: [security, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          echo "sha_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "week_tag=week6" >> "$GITHUB_OUTPUT"

      - name: Build backend image
        run: |
          docker build \
            -f backend/Dockerfile \
            -t collegelife-backend:${{ steps.vars.outputs.sha_tag }} \
            -t collegelife-backend:${{ steps.vars.outputs.week_tag }} \
            backend

      - name: Build frontend image
        run: |
          docker build \
            -f frontend/Dockerfile \
            -t collegelife-frontend:${{ steps.vars.outputs.sha_tag }} \
            -t collegelife-frontend:${{ steps.vars.outputs.week_tag }} \
            frontend